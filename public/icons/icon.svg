<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="sun" cx="50%" cy="38%" r="70%">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="0.55" stop-color="#f6c21c"/>
      <stop offset="1" stop-color="#e09a12"/>
    </radialGradient>
    <linearGradient id="cowl" x1="0" x2="1">
      <stop offset="0" stop-color="#8e0f1d"/>
      <stop offset="0.35" stop-color="#d0202f"/>
      <stop offset="0.7" stop-color="#b3121f"/>
      <stop offset="1" stop-color="#7c0b15"/>
