    <path d="M166 150 l10 20 l10 -20 Z" fill="#2f6fd6"/><path d="M190 150 l10 20 l10 -20 Z" fill="#ff7ab8"/>
    <path d="M214 150 l10 20 l10 -20 Z" fill="#ffffff"/><path d="M238 150 l10 20 l10 -20 Z" fill="#e2253a"/>
    <path d="M262 150 l10 20 l10 -20 Z" fill="#18a39a"/><path d="M286 150 l10 20 l10 -20 Z" fill="#2f6fd6"/>
    <path d="M310 150 l10 20 l10 -20 Z" fill="#ff7ab8"/><path d="M334 150 l10 20 l10 -20 Z" fill="#ffffff"/>
    <path d="M358 150 l10 20 l10 -20 Z" fill="#e2253a"/><path d="M382 150 l10 20 l10 -20 Z" fill="#18a39a"/>
