    <rect x="352" y="148" width="14" height="110" fill="#151515"/>
    <rect x="160" y="150" width="192" height="104" fill="#bfe0f2"/>
  </g>
  <!-- driver -->
  <rect x="214" y="214" width="84" height="44" rx="10" fill="#2f6fb0"/>
  <circle cx="256" cy="196" r="24" fill="#8a5a3c"/>
  <path d="M232 192 Q256 158 280 192 Q268 178 256 178 Q244 178 232 192 Z" fill="#1b1b1b"/>
  <rect x="244" y="205" width="24" height="5" rx="2" fill="#1b1b1b"/>
  <circle cx="247" cy="194" r="3" fill="#111"/><circle cx="265" cy="194" r="3" fill="#111"/>
