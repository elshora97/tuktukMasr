  </defs>
  <rect width="512" height="512" fill="url(#sun)"/>
  <!-- sun rays -->
  <g fill="#fff3c4" opacity="0.35">
    <path d="M256 196 L196 0 H236 Z"/><path d="M256 196 L276 0 H316 Z"/>
    <path d="M256 196 L0 70 V120 Z"/><path d="M256 196 L512 70 V120 Z"/>
    <path d="M256 196 L80 0 H130 Z"/><path d="M256 196 L382 0 H432 Z"/>
  </g>
  <!-- road -->
  <path d="M0 420 L512 420 L512 512 L0 512 Z" fill="#4a4744"/>
  <g fill="#ece6d6"><rect x="40" y="462" width="70" height="12" rx="3"/><rect x="221" y="462" width="70" height="12" rx="3"/><rect x="402" y="462" width="70" height="12" rx="3"/></g>
  <ellipse cx="256" cy="430" rx="150" ry="20" fill="#000" opacity="0.35"/>
