  <circle cx="300" cy="190" r="11" fill="#1f63d6" stroke="#1a0d06" stroke-width="3"/>
  <circle cx="300" cy="190" r="5" fill="#fff"/><circle cx="300" cy="190" r="2.5" fill="#0b1630"/>
